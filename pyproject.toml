[build-system]
requires = ["hatchling", "hatch-vcs"]         # 1. 添加插件
build-backend = "hatchling.build"
[project]
name = "ai-tkzs-utils"
dynamic = ["version"]   # 2. 动态版本好
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cryptography>=47.0.0",
    "loguru>=0.7.3",
    "pydantic-settings>=2.14.0",
    "python-dotenv>=1.2.2",
    "structlog>=25.5.0",
]

[tool.hatch.build]
# Editable installs (uv sync / pip install -e) must put `src` on sys.path so
# `import tkzs_utils` resolves. Without this, only dist-info is installed.
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/tkzs_utils"]

[tool.hatch.version] # 设置版本号来源
source = "vcs"    
[tool.hatch.version.raw-options]
#version_scheme = "no-guess-dev"               # 在非 release 标签时，不增加开发版本号
local_scheme = "no-local-version"    

[tool.hatch.build.hooks.vcs] 
version-file = "_version.py"


[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
